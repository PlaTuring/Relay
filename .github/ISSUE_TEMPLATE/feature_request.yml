name: Feature request
description: 提议符合 Relay 产品范围的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景与当前阻碍，不要附带私有项目内容。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的完成标准
      description: 说明如何判断功能已经正确完成。
    validations:
      required: true
