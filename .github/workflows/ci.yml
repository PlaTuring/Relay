name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json
      - name: Install locked JavaScript dependencies
        run: npm ci --prefix apps/control-plane
      - name: Materialize pinned Electron runtime
        run: node apps/control-plane/node_modules/electron/install.js
      - name: Repository contracts
        run: npm test
      - name: Workflow compiler
        run: npm --prefix packages/workflow/h3-compiler test
      - name: Control-plane typecheck
        run: npm --prefix apps/control-plane run typecheck
      - name: Control-plane regression suite
        run: npm --prefix apps/control-plane test
      - name: Open-source and supply-chain hygiene
        run: |
          npm run verify:oss
          npm --prefix apps/control-plane run licenses:source
          npm --prefix apps/control-plane run sbom:source
