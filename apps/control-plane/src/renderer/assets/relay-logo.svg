    <circle cx="358" cy="146" r="104" fill="none" stroke="#C7D2FE" stroke-opacity="0.14" stroke-width="4"/>
    <circle cx="358" cy="42" r="8" fill="#67E8F9" fill-opacity="0.72"/>
    <circle cx="462" cy="146" r="8" fill="#C4B5FD" fill-opacity="0.72"/>
  </g>

