<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Relay</title>
  <desc id="desc">An open-loop Relay R in a blue, indigo and cyan product palette.</desc>
  <defs>
    <linearGradient id="relay-bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.52" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="relay-glow" cx="0" cy="0" r="1" gradientTransform="translate(356 148) rotate(132) scale(286)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <filter id="relay-shadow" x="24" y="28" width="464" height="468" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
    <clipPath id="relay-plate"><rect x="40" y="40" width="432" height="432" rx="112"/></clipPath>
  </defs>

  <g filter="url(#relay-shadow)">
