<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Relay 1.0.2 工作区界面导览</title>
  <desc id="desc">Relay 专业导播工作区的无用户数据界面示意，展示项目设置、镜头时间线、工作流参数和 ComfyUI 交接检查。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dbeafe"/>
      <stop offset=".5" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1e3a8a" flood-opacity=".18"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#334155" flood-opacity=".07"/>
    </filter>
  </defs>

  <rect width="1400" height="820" rx="34" fill="url(#canvas)"/>
  <circle cx="1328" cy="42" r="260" fill="#60a5fa" opacity=".12"/>
  <circle cx="90" cy="810" r="270" fill="#818cf8" opacity=".08"/>

  <g filter="url(#windowShadow)">
    <rect x="38" y="30" width="1324" height="758" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  </g>

  <path d="M62 30h1276a24 24 0 0 1 24 24v48H38V54a24 24 0 0 1 24-24Z" fill="#fff"/>
  <path d="M38 102h1324" stroke="#dbe2ea"/>
  <circle cx="72" cy="66" r="7" fill="#f87171"/>
  <circle cx="96" cy="66" r="7" fill="#fbbf24"/>
  <circle cx="120" cy="66" r="7" fill="#34d399"/>

  <g transform="translate(150 47)">
    <rect width="38" height="38" rx="11" fill="url(#brand)"/>
    <rect x="8" y="9" width="18" height="15" rx="5" fill="none" stroke="#fff" stroke-width="2.8"/>
    <path d="M15 17h13a8 8 0 0 1 0 16H15m2-5-5 5 5 5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="201" y="70" fill="#0f172a" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="760">Relay</text>
  <text x="201" y="87" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="12">版本 1.0.2</text>
  <text x="370" y="74" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="15">本地工作区  /  MiniMax H3  /  ComfyUI</text>
  <g transform="translate(1130 52)">
    <rect width="190" height="32" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="19" cy="16" r="5" fill="#10b981"/>
    <text x="33" y="21" fill="#334155" font-family="Inter,Segoe UI,sans-serif" font-size="14">Relay 服务可用</text>
  </g>

  <rect x="38" y="102" width="158" height="686" fill="#fbfdff"/>
  <path d="M196 102v686" stroke="#dbe2ea"/>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="14" fill="#64748b">
    <text x="83" y="157">⌂  项目</text>
    <text x="72" y="211">◇  快速创建</text>
    <rect x="50" y="238" width="134" height="48" rx="10" fill="#eaf2ff" stroke="#b9d2ff"/>
    <text x="69" y="268" fill="#1d4ed8" font-weight="700">▦  专业导播</text>
    <text x="80" y="326">▨  素材库</text>
    <text x="72" y="380">▶  视频成品</text>
    <text x="72" y="434">⌁  画质超分</text>
    <text x="80" y="724">ⓘ  关于</text>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="236" y="145" fill="#2563eb" font-size="14" font-weight="700">本地镜头编排</text>
    <text x="236" y="184" fill="#0f172a" font-size="31" font-weight="780">专业导播</text>
    <text x="236" y="211" fill="#64748b" font-size="15">组织镜头、素材与连续性，再编译为可继续编辑的 ComfyUI 工作流。</text>
    <rect x="1148" y="144" width="172" height="46" rx="10" fill="url(#button)"/>
    <text x="1234" y="173" fill="#fff" text-anchor="middle" font-size="14" font-weight="700">编译并交接  ↗</text>
    <rect x="1000" y="147" width="132" height="40" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1066" y="172" fill="#047857" text-anchor="middle" font-size="13" font-weight="700">检查通过</text>
  </g>

  <g filter="url(#cardShadow)" font-family="Inter,Segoe UI,sans-serif">
    <rect x="228" y="238" width="742" height="194" rx="16" fill="#fff" stroke="#d7dee8"/>
    <text x="250" y="270" fill="#0f172a" font-size="17" font-weight="740">项目设置与高级参数</text>
    <text x="250" y="291" fill="#64748b" font-size="12">工作流名称、模式、画布、采样与分段</text>
    <g transform="translate(250 312)">
      <rect width="320" height="82" rx="11" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="16" y="26" fill="#475569" font-size="12" font-weight="650">工作流名称</text>
      <text x="16" y="56" fill="#0f172a" font-size="15">城市晨光 · 三镜头示例</text>
      <rect x="338" width="174" height="82" rx="11" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="354" y="26" fill="#475569" font-size="12" font-weight="650">工作流模式</text>
      <text x="354" y="56" fill="#0f172a" font-size="15">文字生成视频</text>
      <rect x="530" width="190" height="82" rx="11" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="546" y="26" fill="#475569" font-size="12" font-weight="650">画面设置</text>
      <text x="546" y="56" fill="#0f172a" font-size="15">16:9 · 0.98 MP</text>
    </g>
  </g>

  <g filter="url(#cardShadow)" font-family="Inter,Segoe UI,sans-serif">
    <rect x="990" y="238" width="330" height="194" rx="16" fill="#fff" stroke="#d7dee8"/>
    <text x="1012" y="270" fill="#0f172a" font-size="17" font-weight="740">工作流参数</text>
    <g font-size="13">
      <text x="1012" y="310" fill="#64748b">生成模式</text><text x="1294" y="310" fill="#0f172a" text-anchor="end" font-weight="650">T2V</text>
      <path d="M1012 324h282" stroke="#edf1f5"/>
      <text x="1012" y="349" fill="#64748b">采样配置</text><text x="1294" y="349" fill="#0f172a" text-anchor="end" font-weight="650">20 步标准</text>
      <path d="M1012 363h282" stroke="#edf1f5"/>
      <text x="1012" y="388" fill="#64748b">种子策略</text><text x="1294" y="388" fill="#0f172a" text-anchor="end" font-weight="650">固定种子</text>
    </g>
  </g>

  <g filter="url(#cardShadow)" font-family="Inter,Segoe UI,sans-serif">
    <rect x="228" y="452" width="742" height="298" rx="16" fill="#fff" stroke="#d7dee8"/>
    <text x="250" y="485" fill="#2563eb" font-size="13" font-weight="700">单一工作区</text>
    <text x="250" y="515" fill="#0f172a" font-size="19" font-weight="740">镜头编排、素材与连续性</text>
    <text x="250" y="539" fill="#64748b" font-size="12">15 秒 · 3 段 × 5 秒</text>
    <g transform="translate(250 565)">
      <rect width="214" height="142" rx="12" fill="#f8fbff" stroke="#93baf7" stroke-width="2"/>
      <rect x="14" y="14" width="35" height="26" rx="7" fill="#dbeafe"/>
      <text x="31" y="32" fill="#1d4ed8" text-anchor="middle" font-size="12" font-weight="700">01</text>
      <text x="14" y="65" fill="#0f172a" font-size="14" font-weight="700">建立环境</text>
      <text x="14" y="88" fill="#64748b" font-size="12">00:00–00:05</text>
      <rect x="14" y="108" width="96" height="20" rx="10" fill="#ecfdf5"/><text x="62" y="122" fill="#047857" text-anchor="middle" font-size="10">提示词已校验</text>

      <rect x="230" width="214" height="142" rx="12" fill="#f8fafc" stroke="#d7dee8"/>
      <rect x="244" y="14" width="35" height="26" rx="7" fill="#eef2ff"/>
      <text x="261" y="32" fill="#4f46e5" text-anchor="middle" font-size="12" font-weight="700">02</text>
      <text x="244" y="65" fill="#0f172a" font-size="14" font-weight="700">主体运动</text>
      <text x="244" y="88" fill="#64748b" font-size="12">00:05–00:10</text>
      <rect x="244" y="108" width="82" height="20" rx="10" fill="#eff6ff"/><text x="285" y="122" fill="#1d4ed8" text-anchor="middle" font-size="10">连续性已连接</text>

      <rect x="460" width="232" height="142" rx="12" fill="#f8fafc" stroke="#d7dee8"/>
      <rect x="474" y="14" width="35" height="26" rx="7" fill="#f0fdf4"/>
      <text x="491" y="32" fill="#15803d" text-anchor="middle" font-size="12" font-weight="700">03</text>
      <text x="474" y="65" fill="#0f172a" font-size="14" font-weight="700">收束镜头</text>
      <text x="474" y="88" fill="#64748b" font-size="12">00:10–00:15</text>
      <rect x="474" y="108" width="91" height="20" rx="10" fill="#f5f3ff"/><text x="519" y="122" fill="#6d28d9" text-anchor="middle" font-size="10">输出前缀安全</text>
    </g>
  </g>

  <g filter="url(#cardShadow)" font-family="Inter,Segoe UI,sans-serif">
    <rect x="990" y="452" width="330" height="298" rx="16" fill="#fff" stroke="#d7dee8"/>
    <text x="1012" y="486" fill="#0f172a" font-size="18" font-weight="740">交接检查</text>
    <text x="1012" y="510" fill="#64748b" font-size="12">交接前确认工作流保持可编辑</text>
    <g font-size="13">
      <circle cx="1020" cy="550" r="9" fill="#dcfce7"/><path d="m1016 550 3 3 6-7" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="555" fill="#334155">节点与模型映射完成</text>
      <circle cx="1020" cy="590" r="9" fill="#dcfce7"/><path d="m1016 590 3 3 6-7" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="595" fill="#334155">素材引用与种子已写入</text>
      <circle cx="1020" cy="630" r="9" fill="#dcfce7"/><path d="m1016 630 3 3 6-7" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1040" y="635" fill="#334155">输出路径通过边界检查</text>
    </g>
    <rect x="1012" y="670" width="286" height="48" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1155" y="699" fill="#1d4ed8" text-anchor="middle" font-size="14" font-weight="700">在 ComfyUI 中打开工作流  ↗</text>
  </g>

  <text x="700" y="806" fill="#475569" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="12">界面导览示意 · Relay 1.0.2 · 不包含用户项目或本机路径</text>
</svg>
